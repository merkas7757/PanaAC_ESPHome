# B2 — Optical loopback SENDER (ESP-A). Drives a climate entity, transmits via a real IR LED
# (38kHz carrier, ir_control: true). Point the IR LED at ESP-B's demodulator. Press "Start
# Send Cycle" to step through states; ESP-B should decode them. See TEST_ENVIRONMENT.md.
esphome:
  name: "panaac-sender"
  friendly_name: "PanaAC Sender"
  min_version: 2025.9.0
  name_add_mac_suffix: false

external_components:
  - source: ../../esphome/components

esp8266:
  board: esp01_1m

logger:
  level: VERBOSE
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

# IR LED (with transistor driver) on GPIO13, 38kHz carrier.
remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13

# Receiver is optional for the sender; omit receiver_id so no listener is registered.
climate:
  - platform: panaac
    id: ac
    name: "PanaAC Sender"
    supports_heat: true
    supports_fan_only: true
    supports_quiet: true
    fan_5level: true
    swing_horizontal: true
    temp_step: 0.5
    ir_control: true        # 38kHz carrier over the air

button:
  - platform: template
    name: "Start Send Cycle"
    id: start_send
    on_press:
      then:
        - script.execute: send_cycle

script:
  - id: send_cycle
    mode: single
    then:
      - logger.log: "SEND STEP 1: COOL 24C LOW VERTICAL"
      - climate.control: { id: ac, mode: "COOL", target_temperature: 24.0, fan_mode: "LOW", swing_mode: "VERTICAL" }
      - delay: 2s
      - logger.log: "SEND STEP 2: HEAT 26.5 MEDIUM OFF"
      - climate.control: { id: ac, mode: "HEAT", target_temperature: 26.5, fan_mode: "MEDIUM", swing_mode: "OFF" }
      - delay: 2s
      - logger.log: "SEND STEP 3: DRY 22 AUTO BOTH"
      - climate.control: { id: ac, mode: "DRY", target_temperature: 22.0, fan_mode: "AUTO", swing_mode: "BOTH" }
      - delay: 2s
      - logger.log: "SEND DONE"