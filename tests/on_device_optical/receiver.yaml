# B2 — Optical loopback RECEIVER (ESP-B). IR demodulator on GPIO14 decodes what ESP-A's IR LED
# sends. Its climate entity + selects should mirror ESP-A's commanded state. See TEST_ENVIRONMENT.md.
esphome:
  name: "panaac-receiver"
  friendly_name: "PanaAC Receiver"
  min_version: 2025.9.0
  name_add_mac_suffix: false

external_components:
  - source: ../../esphome/components

esp8266:
  board: esp01_1m

logger:
  level: VERBOSE
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

# A transmitter is required by climate_ir; use an unconnected pin so nothing is driven.
remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13

climate:
  - platform: panaac
    id: ac
    name: "PanaAC Receiver"
    receiver_id: ir_receiver
    supports_heat: true
    supports_fan_only: true
    supports_quiet: true
    fan_5level: true
    swing_horizontal: true
    temp_step: 0.5
    ir_control: true