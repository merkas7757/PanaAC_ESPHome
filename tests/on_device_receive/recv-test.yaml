# B3 — On-device real-remote receive test config.
# Flash this to an ESP8266 wired with an IR receiver demodulator (e.g. TSOP38238), then point
# the real Panasonic AC remote at it and press buttons. `esphome logs` at VERBOSE shows the
# decoded 19-byte frame and the resulting climate state. See TEST_ENVIRONMENT.md.
esphome:
  name: "panaac-recv"
  friendly_name: "PanaAC Receive Test"
  min_version: 2025.9.0
  name_add_mac_suffix: false

external_components:
  - source: ../../esphome/components

esp8266:
  board: esp01_1m

# VERBOSE so the decoder's ESP_LOGV lines ("Command decoded: ...") are emitted.
logger:
  level: VERBOSE

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

# IR receiver only for this test. Connect the demodulator DATA pin to GPIO14.
remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  tolerance: 55%
  id: ir_receiver
  idle: 5ms   # required: split Panasonic 2-frame signal reliably

# A transmitter is required by climate_ir (DEPENDENCY) even if unused here.
# Use a separate, unconnected pin so nothing is driven.
remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13

climate:
  - platform: panaac
    name: "PanaAC"
    receiver_id: ir_receiver
    supports_heat: true
    supports_fan_only: true
    supports_quiet: true
    fan_5level: true
    swing_horizontal: true
    temp_step: 0.5
    ir_control: false