# B5 — Home Assistant entity-integration verification. All panaac flags ON so the full entity
# surface is exercised: the climate card + 3 selects (Fan Level with 7 options incl. Quiet,
# Swing Vertical, Swing Horizontal). Use this with the HA verification checklist in
# TEST_ENVIRONMENT.md. Receiver/transmitter share GPIO4 (invasive) so you can also self-receive.
esphome:
  name: "panaac-ha"
  friendly_name: "PanaAC HA Integration"
  min_version: 2025.9.0
  name_add_mac_suffix: false

external_components:
  - source: ../../esphome/components

esp8266:
  board: esp01_1m

logger:
  level: DEBUG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

remote_receiver:
  pin:
    number: GPIO4
    inverted: true
    mode:
      output: true
      open_drain: true
    allow_other_uses: true
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO4
    inverted: true
    mode:
      output: true
      open_drain: true
    allow_other_uses: true

climate:
  - platform: panaac
    id: ac
    name: "PanaAC HA"
    receiver_id: ir_receiver
    supports_heat: true
    supports_cool: true
    supports_fan_only: true
    supports_quiet: true
    fan_5level: true
    swing_horizontal: true
    temp_step: 0.5
    ir_control: false
    fanlevel_id: fanlevel
    swingv_id: swingv
    swingh_id: swingh