# B4 — End-to-end test against the real Panasonic AC (invasive/direct-wired, the recommended
# long-term method). The ESP shares GPIO4 with the AC's IR board (allow_other_uses). Press
# "Run AC Test" to sequence: power on COOL 24, raise temp, change fan, change swing, power off.
# Watch the AC physically respond to each command. See TEST_ENVIRONMENT.md.
esphome:
  name: "panaac-realac"
  friendly_name: "PanaAC Real AC Test"
  min_version: 2025.9.0
  name_add_mac_suffix: false

external_components:
  - source: ../../esphome/components

esp8266:
  board: esp01_1m

logger:
  level: VERBOSE
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

# Invasive shared pin: receiver + transmitter on GPIO4, wired to the AC's IR board signal.
remote_receiver:
  pin:
    number: GPIO4
    inverted: true
    mode:
      output: true
      open_drain: true
    allow_other_uses: true
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO4
    inverted: true
    mode:
      output: true
      open_drain: true
    allow_other_uses: true

climate:
  - platform: panaac
    id: ac
    name: "PanaAC Real AC"
    receiver_id: ir_receiver
    supports_heat: true
    supports_fan_only: true
    supports_quiet: true
    fan_5level: true
    swing_horizontal: true
    temp_step: 0.5
    ir_control: false        # baseband into the AC IR board

button:
  - platform: template
    name: "Run AC Test"
    id: run_ac_test
    on_press:
      then:
        - script.execute: ac_test

script:
  - id: ac_test
    mode: single
    then:
      - logger.log: "AC TEST: power ON, COOL 24C, fan AUTO, swing VERTICAL"
      - climate.control: { id: ac, mode: "COOL", target_temperature: 24.0, fan_mode: "AUTO", swing_mode: "VERTICAL" }
      - delay: 6s
      - logger.log: "AC TEST: raise to 27C"
      - climate.control: { id: ac, target_temperature: 27.0 }
      - delay: 6s
      - logger.log: "AC TEST: fan HIGH"
      - climate.control: { id: ac, fan_mode: "HIGH" }
      - delay: 6s
      - logger.log: "AC TEST: swing OFF"
      - climate.control: { id: ac, swing_mode: "OFF" }
      - delay: 6s
      - logger.log: "AC TEST: power OFF"
      - climate.control: { id: ac, mode: "OFF" }
      - delay: 2s
      - logger.log: "AC TEST DONE"